# VectorFS website — the only site configuration file.

title: &siteTitle VectorFS
baseURL: https://vectorfs.io/
defaultContentLanguage: en
disableLanguages: [fr]
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: *siteTitle
    params:
      description: >-
        A self-hosted, single-binary vector store that speaks the S3 Vectors
        API and turns the files you drop in into searchable embeddings.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 自托管、单二进制的 S3 Vectors 兼容向量存储，文件放进去，按语义找出来。
  # Keep French declared so Hugo recognizes .fr.md as a disabled translation.
  fr:
    label: Français
    locale: fr-FR
    weight: 3
    title: *siteTitle

# OINK's Markdown components depend on these three Goldmark settings.
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: The VectorFS authors
    from_year: 2026
  footer_center_info: ''
  github_repo: https://github.com/vectorfs/vectorfs
  github_branch: main
  logo: icons/logo.png
  ui:
    compare: true
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true
    theme_color: '#4f46e5'

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0
